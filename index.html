<!DOCTYPE html>
<html>
<head>
    <title>Distance Sensor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {font-family: Arial; text-align: center; padding: 50px; background-color: #2c3e50; color: white;}
        .container {background-color: #34495e; padding: 40px; border-radius: 15px; max-width: 400px; margin: 0 auto;}
        h1 {font-size: 2em; margin-bottom: 30px;}
        .distance {font-size: 5em; font-weight: bold; color: #3498db;}
        .unit {font-size: 0.3em; color: #95a5a6;}
        .info {margin-top: 30px; font-size: 1.2em; color: #95a5a6;}
        .status {margin: 20px 0; font-size: 1.5em; font-weight: bold;}
        .status.active {color: #2ecc71;}
        .status.inactive {color: #e74c3c;}
        button {
            font-size: 1.5em;
            padding: 15px 40px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .start-btn {background-color: #2ecc71; color: white;}
        .start-btn:hover {background-color: #27ae60;}
        .stop-btn {background-color: #e74c3c; color: white;}
        .stop-btn:hover {background-color: #c0392b;}
        .disabled {opacity: 0.5; cursor: not-allowed;}
    </style>
    <script>
        let isActive = false;

        function updateStatus() {
            fetch('/status').then(r => r.json()).then(data => {
                isActive = data.active;
                document.getElementById('status').textContent = isActive ? 'ACTIVE' : 'STOPPED';
                document.getElementById('status').className = 'status ' + (isActive ? 'active' : 'inactive');
                document.getElementById('startBtn').disabled = isActive;
                document.getElementById('stopBtn').disabled = !isActive;
            });
        }

        function getDistance() {
            if (isActive) {
                fetch('/distance').then(r => r.text()).then(d => {
                    document.getElementById('distance').textContent = d;
                });
            }
        }

        function startSensing() {
            fetch('/start').then(() => {
                updateStatus();
            });
        }

        function stopSensing() {
            fetch('/stop').then(() => {
                updateStatus();
                document.getElementById('distance').textContent = '--';
            });
        }

        setInterval(getDistance, 500);
        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
</head>
<body>
    <div class="container">
        <h1>Distance Sensor</h1>
        <div class="status inactive" id="status">STOPPED</div>
        <div class="distance"><span id="distance">--</span><span class="unit">cm</span></div>
        <div style="margin-top: 30px;">
            <button id="startBtn" class="start-btn" onclick="startSensing()">START</button>
            <button id="stopBtn" class="stop-btn" onclick="stopSensing()" disabled>STOP</button>
        </div>
        <div class="info">Press START to begin sensing</div>
    </div>
</body>
</html>
