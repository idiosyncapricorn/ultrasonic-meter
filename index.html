<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor de Distancia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      transition: background 500ms ease;
    }

    body.proximity-close {
      background: radial-gradient(circle at center, #10b981 0%, #059669 50%, #16213e 100%);
    }

    body.proximity-medium {
      background: radial-gradient(circle at center, #34d399 0%, #10b981 30%, #16213e 80%);
    }

    body.proximity-far {
      background: radial-gradient(circle at center, #6ee7b7 0%, #34d399 20%, #16213e 60%);
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .sensor-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }

    .distance-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .distance-value {
      font-size: 96px;
      font-weight: 700;
      color: #ffffff;
      font-family: "Courier New", monospace;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }

    .distance-unit {
      font-size: 32px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
      transition: all 300ms ease;
    }

    .status.active .status-indicator {
      background: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
    }

    .status-text {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
    }

    .button-group {
      display: flex;
      gap: 16px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 300ms ease;
      font-family: inherit;
    }

    .btn-icon {
      font-size: 14px;
    }

    .btn-start {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-start:hover {
      background: rgba(16, 185, 129, 0.3);
      transform: translateY(-2px);
    }

    .btn-start.active {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.6);
    }

    .btn-start.inactive {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-stop {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-stop:hover {
      background: rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
    }

    .btn-stop.active {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.6);
    }

    .btn-stop.inactive {
      opacity: 0.3;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .sensor-card {
        padding: 32px 24px;
      }

      .title {
        font-size: 24px;
        margin-bottom: 32px;
      }

      .distance-value {
        font-size: 72px;
      }

      .distance-unit {
        font-size: 24px;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sensor-card">
      <h1 class="title">Sensor de Distancia</h1>

      <div class="distance-display">
        <div class="distance-value" id="distanceValue">--</div>
        <div class="distance-unit">cm</div>
      </div>

      <div class="status" id="status">
        <div class="status-indicator"></div>
        <span class="status-text">Detenido</span>
      </div>

      <div class="button-group">
        <button class="btn btn-start" id="startBtn">
          <span class="btn-icon">▶</span>
          Iniciar
        </button>
        <button class="btn btn-stop" id="stopBtn">
          <span class="btn-icon">■</span>
          Detener
        </button>
      </div>
    </div>
  </div>

  <script>
    // API endpoint - replace with your actual sensor endpoint
    const API_BASE = "http://your-sensor-ip:port"

    let isActive = false
    let pollInterval = null

    const elements = {
      distanceValue: document.getElementById("distanceValue"),
      status: document.getElementById("status"),
      statusText: document.querySelector(".status-text"),
      startBtn: document.getElementById("startBtn"),
      stopBtn: document.getElementById("stopBtn"),
      body: document.body,
    }

    // Update UI based on sensor state
    function updateUI(state) {
      isActive = state

      if (state) {
        elements.status.classList.add("active")
        elements.statusText.textContent = "Activo"
        elements.startBtn.classList.add("active")
        elements.startBtn.classList.remove("inactive")
        elements.stopBtn.classList.remove("active")
        elements.stopBtn.classList.add("inactive")
      } else {
        elements.status.classList.remove("active")
        elements.statusText.textContent = "Detenido"
        elements.startBtn.classList.remove("active")
        elements.startBtn.classList.remove("inactive")
        elements.stopBtn.classList.remove("active")
        elements.stopBtn.classList.remove("inactive")
        elements.distanceValue.textContent = "--"
        updateBackgroundGradient(null)
      }
    }

    // Update background gradient based on distance
    function updateBackgroundGradient(distance) {
      if (distance === null) {
        elements.body.className = ""
        return
      }

      elements.body.className = ""

      if (distance < 20) {
        elements.body.classList.add("proximity-far")
      } else if (distance < 50) {
        elements.body.classList.add("proximity-medium")
      } else if (distance < 100) {
        elements.body.classList.add("proximity-close")
      }
    }

    // Fetch distance from sensor
    async function fetchDistance() {
      try {
        const response = await fetch(`${API_BASE}/api/distance`)
        const data = await response.json()

        if (data.distance !== undefined) {
          elements.distanceValue.textContent = data.distance.toFixed(1)
          updateBackgroundGradient(data.distance)
        }
      } catch (error) {
        console.error("Error fetching distance:", error)
      }
    }

    // Start sensor
    async function startSensor() {
      try {
        const response = await fetch(`${API_BASE}/api/start`, { method: "POST" })
        const data = await response.json()

        if (data.status === "started") {
          updateUI(true)

          // Start polling for distance
          pollInterval = setInterval(fetchDistance, 500)
        }
      } catch (error) {
        console.error("Error starting sensor:", error)
        alert("Error al iniciar el sensor")
      }
    }

    // Stop sensor
    async function stopSensor() {
      try {
        const response = await fetch(`${API_BASE}/api/stop`, { method: "POST" })
        const data = await response.json()

        if (data.status === "stopped") {
          updateUI(false)

          // Stop polling
          if (pollInterval) {
            clearInterval(pollInterval)
            pollInterval = null
          }
        }
      } catch (error) {
        console.error("Error stopping sensor:", error)
        alert("Error al detener el sensor")
      }
    }

    // Check initial status
    async function checkStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`)
        const data = await response.json()
        updateUI(data.active)

        if (data.active) {
          pollInterval = setInterval(fetchDistance, 500)
        }
      } catch (error) {
        console.error("Error checking status:", error)
      }
    }

    // Event listeners
    elements.startBtn.addEventListener("click", () => {
      if (!isActive) startSensor()
    })

    elements.stopBtn.addEventListener("click", () => {
      if (isActive) stopSensor()
    })

    // Initialize
    checkStatus()
  </script>
</body>
</html>
